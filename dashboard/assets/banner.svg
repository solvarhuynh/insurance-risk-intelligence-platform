 <g font-family="Arial,Segoe UI,sans-serif" font-size="12.5" font-weight="700" fill="#CEDDE6">
  <rect x="52" y="292" width="83" height="31" rx="8" fill="#1D344B" stroke="#37516A"/><text x="68" y="312">Python</text>
  <rect x="144" y="292" width="112" height="31" rx="8" fill="#1D344B" stroke="#37516A"/><text x="161" y="312">SQL Server</text>
  <rect x="265" y="292" width="91" height="31" rx="8" fill="#1D344B" stroke="#37516A"/><text x="280" y="312">Airflow</text>
  <rect x="365" y="292" width="86" height="31" rx="8" fill="#1D344B" stroke="#37516A"/><text x="381" y="312">Docker</text>
  <rect x="460" y="292" width="159" height="31" rx="8" fill="#1D344B" stroke="#37516A"/><text x="477" y="312">Machine Learning</text>
 </g>
