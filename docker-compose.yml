services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: insurance_sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # Required for the isolated P1-INC-02 CDC engineering demonstration.
      # CDC remains disabled until the versioned demo migration is applied.
      MSSQL_AGENT_ENABLED: "true"
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD in the ignored .env file or process environment.}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./data/raw:/var/opt/mssql/raw_data:ro

  airflow:
    profiles: ["orchestration"]
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: insurance_airflow
    restart: unless-stopped
    depends_on:
      - sqlserver
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-configure-before-orchestration-runtime}
      SQLSERVER_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD in the ignored .env file or process environment.}
      SQLSERVER_HOST: sqlserver,1433
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./sql:/opt/airflow/sql
      - ./log:/opt/airflow/logs
      - ./data/raw:/opt/airflow/raw_data:ro
      - ./scripts:/opt/airflow/project/scripts:ro
      - ./ml:/opt/airflow/project/ml:ro
      - ./reports:/opt/airflow/project/reports
    command: standalone

volumes:
  sqlserver_data:
    driver: local
