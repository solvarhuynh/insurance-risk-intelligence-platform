<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790" role="img" aria-labelledby="title desc">
  <title id="title">Insurance Data Platform architecture</title>
  <desc id="desc">Two independent CSV tracks flow through Python ingestion, separate SQL Server star schemas and quality gates. SUSEP produces market aggregates; brvehins1 produces held-out model scores. An aggregate JSON snapshot feeds Plotly Dash. Airflow orchestrates both tracks and Docker Compose runs local services.</desc>
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#142b3a"/><stop offset="1" stop-color="#20515a"/></linearGradient>
    <filter id="cardShadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#17394b" flood-opacity=".07"/></filter>
    <marker id="arrowA" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L7 4 1 7" fill="none" stroke="#168892" stroke-width="1.7"/></marker>
    <marker id="arrowB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L7 4 1 7" fill="none" stroke="#477fac" stroke-width="1.7"/></marker>
    <marker id="arrowCommon" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L7 4 1 7" fill="none" stroke="#607e8b" stroke-width="1.7"/></marker>
  </defs>

  <rect width="1400" height="790" rx="22" fill="#f5f8fa"/>
  <path d="M22 0H1378Q1400 0 1400 22V122H0V22Q0 0 22 0Z" fill="url(#head)"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="55" y="38" font-size="12" font-weight="700" letter-spacing="2.3" fill="#91d3d2">SYSTEM ARCHITECTURE</text>
    <text x="55" y="80" font-size="33" font-weight="700" fill="#f6faf9">Two data tracks. One analytics layer.</text>
    <text x="56" y="107" font-size="14" fill="#b8d1d4">Local CSV → Python → SQL Server → quality checks → dated dashboard snapshot</text>
    <rect x="1126" y="30" width="221" height="30" rx="15" fill="#2d5963" stroke="#517783"/>
    <text x="1236" y="50" font-size="12" text-anchor="middle" fill="#d9f2ef">Airflow · orchestration</text>
    <rect x="1126" y="70" width="221" height="30" rx="15" fill="#2d5963" stroke="#517783"/>
    <text x="1236" y="90" font-size="12" text-anchor="middle" fill="#d9f2ef">Docker Compose · runtime</text>

    <rect x="42" y="143" width="1301" height="214" rx="17" fill="#e9f5f3" stroke="#cfe5df"/>
    <rect x="42" y="143" width="6" height="214" rx="3" fill="#168892"/>
    <text x="67" y="176" font-size="13" font-weight="700" letter-spacing="1.4" fill="#087f8c">TRACK A  /  SUSEP MARKET</text>
    <text x="67" y="200" font-size="13" fill="#537781">8,338,214 rows · company / month / product / state · Jan 2003–Jul 2023</text>

    <rect x="58" y="218" width="184" height="111" rx="12" fill="#fff" stroke="#d9e9e5" filter="url(#cardShadow)"/>
    <rect x="70" y="231" width="40" height="28" rx="6" fill="#d9efeb"/>
    <text x="90" y="250" font-size="12" font-weight="700" text-anchor="middle" fill="#087f8c">CSV</text>
    <text x="72" y="282" font-size="17" font-weight="700" fill="#243d4c">SUSEP source</text>
    <text x="72" y="307" font-size="12" fill="#6a8290">Immutable local file</text>

    <path d="M243 274H273" stroke="#168892" stroke-width="2.2" marker-end="url(#arrowA)"/>
    <rect x="279" y="218" width="183" height="111" rx="12" fill="#fff" stroke="#d9e9e5" filter="url(#cardShadow)"/>
    <rect x="291" y="231" width="38" height="28" rx="6" fill="#d9efeb"/>
    <text x="310" y="250" font-size="12" font-weight="700" text-anchor="middle" fill="#087f8c">PY</text>
    <text x="293" y="282" font-size="17" font-weight="700" fill="#243d4c">Ingestion</text>
    <text x="293" y="307" font-size="12" fill="#6a8290">Streaming + lineage</text>

    <path d="M463 274H493" stroke="#168892" stroke-width="2.2" marker-end="url(#arrowA)"/>
    <rect x="499" y="218" width="279" height="111" rx="12" fill="#fff" stroke="#d9e9e5" filter="url(#cardShadow)"/>
    <rect x="511" y="231" width="42" height="28" rx="6" fill="#d9efeb"/>
    <text x="532" y="250" font-size="12" font-weight="700" text-anchor="middle" fill="#087f8c">SQL</text>
    <text x="513" y="282" font-size="17" font-weight="700" fill="#243d4c">Market warehouse</text>
    <text x="513" y="307" font-size="12" fill="#6a8290">Staging → star schema</text>

    <path d="M779 274H809" stroke="#168892" stroke-width="2.2" marker-end="url(#arrowA)"/>
    <rect x="815" y="218" width="177" height="111" rx="12" fill="#fff" stroke="#d9e9e5" filter="url(#cardShadow)"/>
    <circle cx="839" cy="245" r="13" fill="#d9efeb"/>
    <path d="M833 245L837 249 845 241" fill="none" stroke="#087f8c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="829" y="282" font-size="17" font-weight="700" fill="#243d4c">Quality gate</text>
    <text x="829" y="307" font-size="12" fill="#6a8290">Rules + reconcile</text>

    <path d="M993 274H1023" stroke="#168892" stroke-width="2.2" marker-end="url(#arrowA)"/>
    <rect x="1029" y="218" width="298" height="111" rx="12" fill="#fff" stroke="#d9e9e5" filter="url(#cardShadow)"/>
    <rect x="1043" y="232" width="10" height="24" rx="2" fill="#83c2c0"/><rect x="1059" y="238" width="10" height="18" rx="2" fill="#35a5a6"/><rect x="1075" y="228" width="10" height="28" rx="2" fill="#087f8c"/>
    <text x="1043" y="282" font-size="17" font-weight="700" fill="#243d4c">Market aggregates</text>
    <text x="1043" y="307" font-size="12" fill="#6a8290">Company · product · month</text>

    <rect x="42" y="379" width="1301" height="214" rx="17" fill="#ecf3fa" stroke="#d2e1f0"/>
    <rect x="42" y="379" width="6" height="214" rx="3" fill="#477fac"/>
    <text x="67" y="412" font-size="13" font-weight="700" letter-spacing="1.4" fill="#3975a8">TRACK B  /  MOTOR RISK</text>
    <text x="67" y="436" font-size="13" fill="#5d7895">1,965,355 observations · separate source grain · no shared row identity with Track A</text>

    <rect x="58" y="454" width="184" height="111" rx="12" fill="#fff" stroke="#dce8f1" filter="url(#cardShadow)"/>
    <rect x="70" y="467" width="40" height="28" rx="6" fill="#e0eaf5"/>
    <text x="90" y="486" font-size="12" font-weight="700" text-anchor="middle" fill="#3975a8">CSV</text>
    <text x="72" y="518" font-size="17" font-weight="700" fill="#243d4c">brvehins1</text>
    <text x="72" y="543" font-size="12" fill="#6a8290">Five local partitions</text>

    <path d="M243 510H273" stroke="#477fac" stroke-width="2.2" marker-end="url(#arrowB)"/>
    <rect x="279" y="454" width="183" height="111" rx="12" fill="#fff" stroke="#dce8f1" filter="url(#cardShadow)"/>
    <rect x="291" y="467" width="38" height="28" rx="6" fill="#e0eaf5"/>
    <text x="310" y="486" font-size="12" font-weight="700" text-anchor="middle" fill="#3975a8">PY</text>
    <text x="293" y="518" font-size="17" font-weight="700" fill="#243d4c">Ingestion</text>
    <text x="293" y="543" font-size="12" fill="#6a8290">Batch validation</text>

    <path d="M463 510H493" stroke="#477fac" stroke-width="2.2" marker-end="url(#arrowB)"/>
    <rect x="499" y="454" width="279" height="111" rx="12" fill="#fff" stroke="#dce8f1" filter="url(#cardShadow)"/>
    <rect x="511" y="467" width="42" height="28" rx="6" fill="#e0eaf5"/>
    <text x="532" y="486" font-size="12" font-weight="700" text-anchor="middle" fill="#3975a8">SQL</text>
    <text x="513" y="518" font-size="17" font-weight="700" fill="#243d4c">Risk warehouse</text>
    <text x="513" y="543" font-size="12" fill="#6a8290">Staging → star schema</text>

    <path d="M779 510H809" stroke="#477fac" stroke-width="2.2" marker-end="url(#arrowB)"/>
    <rect x="815" y="454" width="177" height="111" rx="12" fill="#fff" stroke="#dce8f1" filter="url(#cardShadow)"/>
    <circle cx="839" cy="481" r="13" fill="#e0eaf5"/>
    <path d="M833 481L837 485 845 477" fill="none" stroke="#3975a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="829" y="518" font-size="17" font-weight="700" fill="#243d4c">Quality gate</text>
    <text x="829" y="543" font-size="12" fill="#6a8290">Track B rules</text>

    <path d="M993 510H1023" stroke="#477fac" stroke-width="2.2" marker-end="url(#arrowB)"/>
    <rect x="1029" y="454" width="298" height="111" rx="12" fill="#fff" stroke="#dce8f1" filter="url(#cardShadow)"/>
    <path d="M1044 491L1058 478 1068 484 1085 467" fill="none" stroke="#3975a8" stroke-width="3" stroke-linecap="round"/>
    <text x="1043" y="518" font-size="17" font-weight="700" fill="#243d4c">Model scoring</text>
    <text x="1043" y="543" font-size="12" fill="#6a8290">20,000 held-out predictions</text>

    <path d="M1328 274H1360V629H750" fill="none" stroke="#7c9aa6" stroke-width="2"/>
    <path d="M1328 510H1360" fill="none" stroke="#7c9aa6" stroke-width="2"/>
    <path d="M750 629V659" fill="none" stroke="#607e8b" stroke-width="2" marker-end="url(#arrowCommon)"/>
    <text x="864" y="622" font-size="11" fill="#69808e">approved aggregates + scores</text>

    <rect x="42" y="664" width="375" height="91" rx="14" fill="#f0f5f7" stroke="#dce7ea"/>
    <text x="62" y="692" font-size="12" font-weight="700" letter-spacing="1" fill="#658090">ORCHESTRATION</text>
    <text x="62" y="720" font-size="19" font-weight="700" fill="#243d4c">Airflow DAG</text>
    <text x="62" y="741" font-size="12" fill="#718694">Runs both tracks independently</text>

    <rect x="513" y="664" width="335" height="91" rx="14" fill="#fff" stroke="#c8dedf" filter="url(#cardShadow)"/>
    <rect x="532" y="683" width="40" height="34" rx="6" fill="#d9efeb"/>
    <text x="552" y="706" font-size="15" font-weight="700" text-anchor="middle" fill="#087f8c">{ }</text>
    <text x="585" y="699" font-size="18" font-weight="700" fill="#243d4c">Aggregate snapshot</text>
    <text x="585" y="726" font-size="12" fill="#6a8290">Dated JSON · no SQL query per view</text>

    <path d="M849 709H944" stroke="#607e8b" stroke-width="2.4" marker-end="url(#arrowCommon)"/>
    <rect x="950" y="664" width="392" height="91" rx="14" fill="#fff" stroke="#c8dedf" filter="url(#cardShadow)"/>
    <rect x="970" y="683" width="36" height="30" rx="5" fill="#d9efeb"/>
    <path d="M979 704V696M987 704V690M995 704V686" stroke="#087f8c" stroke-width="3" stroke-linecap="round"/>
    <text x="1020" y="699" font-size="18" font-weight="700" fill="#243d4c">Plotly Dash</text>
    <text x="1020" y="726" font-size="12" fill="#6a8290">Interactive dashboard · filters + CSV</text>

    <text x="43" y="781" font-size="11" fill="#8498a4">Docker Compose runs SQL Server, Airflow and Dash. SQL data persists in the sqlserver_data volume.</text>
  </g>
</svg>
