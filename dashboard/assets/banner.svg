<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
  <title id="title">Insurance Data Platform</title>
  <desc id="desc">Personal data engineering project with a compass pointing to insurance risk. Built with Python, SQL Server, Airflow, Docker and machine learning.</desc>
  <defs>
    <linearGradient id="bannerBg" x2="1" y2=".7"><stop stop-color="#122736"/><stop offset="1" stop-color="#1c454c"/></linearGradient>
    <linearGradient id="panelBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f5ef"/><stop offset=".56" stop-color="#e7efec"/><stop offset="1" stop-color="#cbdde0"/></linearGradient>
    <radialGradient id="dial" cx="50%" cy="46%" r="62%"><stop stop-color="#fafaf5"/><stop offset=".8" stop-color="#d7e4e4"/><stop offset="1" stop-color="#92aaae"/></radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#4d676f"/><stop offset=".35" stop-color="#e1ebea"/><stop offset=".68" stop-color="#728d94"/><stop offset="1" stop-color="#283f4a"/></linearGradient>
    <linearGradient id="pointer" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#187aa4"/><stop offset="1" stop-color="#4eaae5"/></linearGradient>
    <pattern id="grid" width="33" height="33" patternUnits="userSpaceOnUse"><path d="M33 0H0V33" fill="none" stroke="#99c6bc" stroke-opacity=".06"/></pattern>
    <clipPath id="panelClip"><rect x="731" y="26" width="517" height="288" rx="14"/></clipPath>
    <path id="insuranceArc" d="M875 185 A126 126 0 0 1 1127 185"/>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#193845" flood-opacity=".25"/></filter>
  </defs>

  <rect width="1280" height="340" rx="20" fill="url(#bannerBg)"/>
  <rect width="1280" height="340" rx="20" fill="url(#grid)"/>

  <rect x="57" y="75" width="5" height="23" rx="2.5" fill="#88d0c5"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="78" y="92" font-size="12" letter-spacing="2.8" fill="#a6d7cf">PERSONAL DATA ENGINEERING PROJECT</text>
    <text x="56" y="166" font-size="46" font-weight="700" letter-spacing="-1" fill="#f7faf8">Insurance Data Platform</text>
    <path d="M57 190H662" stroke="#a5cac4" stroke-opacity=".26"/>
    <text x="57" y="224" font-size="13" letter-spacing="1" fill="#a9c9c8">PYTHON  /  SQL SERVER  /  AIRFLOW  /  DOCKER  /  MACHINE LEARNING</text>
  </g>

  <g clip-path="url(#panelClip)">
    <rect x="731" y="26" width="517" height="288" fill="url(#panelBg)"/>
    <circle cx="1001" cy="190" r="180" fill="url(#dial)" opacity=".56"/>
    <circle cx="1001" cy="190" r="159" fill="none" stroke="#748f94" stroke-width="1" stroke-opacity=".48"/>
    <circle cx="1001" cy="190" r="151" fill="none" stroke="#fff" stroke-width="7" stroke-opacity=".65"/>
    <circle cx="1001" cy="190" r="146" fill="none" stroke="#38515c" stroke-width="7" stroke-dasharray="1 8.56" stroke-opacity=".38"/>
    <circle cx="1001" cy="190" r="134" fill="none" stroke="#8da4a6" stroke-width="1.3" stroke-opacity=".7"/>
    <circle cx="1001" cy="190" r="126" fill="none" stroke="#f7faf7" stroke-width="2" stroke-opacity=".75"/>
    <text fill="#3c8fc3" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="750" letter-spacing="3.2">
      <textPath href="#insuranceArc" xlink:href="#insuranceArc" startOffset="50%" text-anchor="middle">INSURANCE</textPath>
    </text>
    <text x="1216" y="174" transform="rotate(90 1216 174)" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#536b72" opacity=".31">RISK</text>
    <g transform="translate(971 213)" opacity=".48">
      <path d="M0-95L14-24 0-8-14-24ZM95 0L24 14 8 0 24-14ZM0 95L-14 24 0 8 14 24ZM-95 0L-24-14-8 0-24 14Z" fill="#324b54"/>
      <path d="M-66-66L-10-22-2-2-22-10ZM66-66L22-10 2-2 10-22ZM66 66L10 22 2 2 22 10ZM-66 66L-22 10-2 2-10 22Z" fill="#647b7f"/>
      <circle r="40" fill="none" stroke="#425e65" stroke-width="1.5"/>
    </g>
    <g filter="url(#shadow)">
      <path d="M918 275L1088 102 1100 114 930 287Z" fill="url(#steel)"/>
      <path d="M941 259L1085 114" fill="none" stroke="#f8ffff" stroke-width="2" opacity=".75"/>
      <path d="M1080 102L1131 70 1105 128 1096 112 1084 116Z" fill="url(#pointer)"/>
      <path d="M1080 102L1131 70 1096 112Z" fill="#74c4eb" opacity=".6"/>
      <circle cx="971" cy="213" r="24" fill="url(#steel)" stroke="#f7f9f4" stroke-width="3"/>
      <circle cx="971" cy="213" r="15" fill="#4e8091" stroke="#cce6e7" stroke-width="2"/>
      <circle cx="971" cy="213" r="7" fill="#e9f3f0"/>
    </g>
  </g>
  <rect x="731.5" y="26.5" width="516" height="287" rx="14" fill="none" stroke="#b0d1ce" stroke-opacity=".55"/>
</svg>
