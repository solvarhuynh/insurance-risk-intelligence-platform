<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
<title id="title">Insurance Data Platform — Data Engineering and Risk Intelligence</title>
<desc id="desc">Modern dark banner for an insurance data engineering project using Python, SQL Server, Apache Airflow, Docker and machine learning, with a data pipeline and risk analytics illustration.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091424"/><stop offset=".55" stop-color="#10243C"/><stop offset="1" stop-color="#102F41"/></linearGradient>
 <radialGradient id="glow" cx="75%" cy="40%" r="55%"><stop stop-color="#1A6680" stop-opacity=".29"/><stop offset="1" stop-color="#0A1B2B" stop-opacity="0"/></radialGradient>
 <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#65E0D1"/><stop offset="1" stop-color="#6BB8F7"/></linearGradient>
 <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1D3D52"/><stop offset="1" stop-color="#142C43"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000A14" flood-opacity=".4"/></filter>
 <pattern id="dots" width="25" height="25" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#A1E8E5" opacity=".12"/></pattern>
 <clipPath id="rounded"><rect width="1280" height="360" rx="22"/></clipPath>
</defs>
<g clip-path="url(#rounded)">
 <rect width="1280" height="360" fill="url(#bg)"/>
 <rect width="1280" height="360" fill="url(#glow)"/>
