 <path d="M1100 -60 C1200 90 1240 210 1320 290" stroke="#81DFE0" stroke-opacity=".07" stroke-width="90" fill="none"/>
 <rect x="51" y="46" width="236" height="31" rx="15.5" fill="#173C48" stroke="#3C7779" stroke-opacity=".6"/>
 <circle cx="69" cy="61.5" r="4" fill="#63DECC"/>
 <text x="83" y="66" font-family="Arial,Segoe UI,sans-serif" font-size="12" font-weight="700" letter-spacing="1.1" fill="#B7EEE6">DATA ENGINEERING PROJECT</text>
 <text x="49" y="148" font-family="Arial,Segoe UI,sans-serif" font-size="52" font-weight="800" letter-spacing="-1.9" fill="#F4FBFF">Insurance</text>
 <text x="49" y="206" font-family="Arial,Segoe UI,sans-serif" font-size="52" font-weight="800" letter-spacing="-1.9" fill="url(#accent)">Data Platform</text>
 <text x="52" y="242" font-family="Arial,Segoe UI,sans-serif" font-size="16" fill="#B3C6D4">From raw insurance data to actionable risk insights.</text>
